[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "proofledger-ai"
version = "1.0.0"
description = "Source-grounded evidence compiler for PayPal digital-goods sellers"
requires-python = ">=3.9"
dependencies = [
    "transformers>=4.47.0",
    "datasets>=3.2.0",
    "torch>=2.0.0",
    "scikit-learn>=1.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "requests>=2.32.0",
    "PyYAML>=6.0",
    "safetensors>=0.4.5",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
