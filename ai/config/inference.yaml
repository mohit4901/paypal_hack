# Inference configuration
model:
  model_path: "artifacts/best_model"  # Override with MODEL_PATH env var
  max_length: 256
  batch_size: 16
  device: "auto"  # auto-detects cuda/mps/cpu

api:
  host: "0.0.0.0"
  port: 8000
  max_request_size_bytes: 1048576  # 1MB
  max_batch_size: 50

labels:
  - SUPPORTED
  - CONTRADICTED
  - INSUFFICIENT_EVIDENCE

thresholds:
  human_review_confidence_below: 0.8
  always_require_human_review: true

